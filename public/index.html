<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoeMart - Online Shoe Store</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="navbar">
        <h1>🛍️ ShoeMart</h1>
        <button id="cartBtn" class="cart-btn">Cart <span id="cartCount">0</span></button>
    </nav>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="men">Men</button>
        <button class="filter-btn" data-filter="women">Women</button>
        <button class="filter-btn" data-filter="kids">Kids</button>
    </div>

    <div id="productsGrid" class="products-grid"></div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2>Shopping Cart</h2>
            <div id="cartItems"></div>
            <div class="cart-summary">
                <p>Subtotal: <span id="subtotal">$0.00</span></p>
                <p>Shipping: <span id="shipping">$0.00</span></p>
                <p><strong>Total: <span id="total">$0.00</span></strong></p>
                <button onclick="checkout()" class="checkout-btn">Checkout</button>
            </div>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeProductModal()">&times;</span>
            <div class="product-detail">
                <img id="detailImage" src="" alt="Product">
                <div class="detail-info">
                    <h2 id="detailName"></h2>
                    <p id="detailPrice" class="price"></p>
                    <p id="detailDescription"></p>
                    <div id="detailRating" class="rating"></div>
                    <p id="detailReviews"></p>
                    <ul id="detailFeatures"></ul>
                    <select id="sizeSelect">
                        <option value="">Select Size</option>
                        <option>6</option><option>7</option><option>8</option>
                        <option>9</option><option>10</option><option>11</option>
                    </select>
                    <div class="quantity">
                        <button onclick="decreaseQuantity()">-</button>
                        <input id="quantityInput" type="number" value="1" min="1">
                        <button onclick="increaseQuantity()">+</button>
                    </div>
                    <button onclick="addToCart()" class="add-btn">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCheckout()">&times;</span>
            <h2>Checkout</h2>
            <form onsubmit="completeOrder(event)">
                <input type="text" id="fullName" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="address" placeholder="Address" required>
                <input type="text" id="city" placeholder="City" required>
                <input type="text" id="zipCode" placeholder="Zip Code" required>
                
                <h3>Payment Method</h3>
                <label><input type="radio" name="paymentMethod" value="COD" required> Cash on Delivery</label>
                <label><input type="radio" name="paymentMethod" value="GPAY"> Google Pay</label>
                <label><input type="radio" name="paymentMethod" value="CARD"> Card</label>
                
                <input type="text" id="cardNumber" placeholder="Card Number (if applicable)">
                <button type="submit" class="order-btn">Place Order</button>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSuccess()">&times;</span>
            <h2>✅ Order Confirmed!</h2>
            <div id="receiptContent"></div>
            <div class="receipt-actions">
                <button onclick="printReceipt()">Print Receipt</button>
                <button onclick="downloadReceipt()">Download Receipt</button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
